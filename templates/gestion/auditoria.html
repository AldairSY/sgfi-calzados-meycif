{% extends "base.html" %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Trazabilidad</p><h1>Auditoría</h1></div></div>
<section class="panel table-wrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Descripción</th></tr></thead><tbody>
{% for r in registros %}<tr><td>{{ r.fecha|date:"d/m/Y H:i" }}</td><td>{{ r.usuario.username }}</td><td>{{ r.modulo }}</td><td>{{ r.accion }}</td><td>{{ r.descripcion }}</td></tr>{% empty %}<tr><td colspan="5">Sin registros.</td></tr>{% endfor %}
</tbody></table></section>
{% endblock %}
